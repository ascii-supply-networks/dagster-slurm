name: SLURM Cluster Image Builder

on:
  push:
    branches: [main]
    paths:
      - "services/slurm/**"
      - "docker-compose.yml"
      - ".github/workflows/slurm-image-builder.yml"
  # Build without pushing, so image changes are tested before they reach main.
  pull_request:
    paths:
      - "services/slurm/**"
      - "docker-compose.yml"
      - ".github/workflows/slurm-image-builder.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/slurm-docker-cluster
  # The 'latest' tags follow this version, which docker-compose.yml also uses.
  DEFAULT_SLURM_VERSION: 25-11-8-1

jobs:
  build-slurm-image:
    name: Build SLURM ${{ matrix.slurm }} Image (${{ matrix.target.platform }})
    runs-on: ${{ matrix.target.runner }}
    # The arm64 build uses a paid larger runner; spend it only on this repo's branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Production clusters upgrade slowly: keep the 25.11 line next to the
        # newest release. Keep in sync with library.yaml.
        slurm: ["25-11-8-1", "26-05-5-1"]
        target:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: arm-runner
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Create a 'latest' tag for the default version on main (good for consumers)
            type=raw,value=latest-${{ matrix.target.arch }},enable=${{ github.ref == 'refs/heads/main' && matrix.slurm == env.DEFAULT_SLURM_VERSION }}

            # === USE THE VERSION TO CREATE A STABLE TAG ===
            # This creates a tag like '25-11-8-1-amd64'
            type=raw,value=${{ matrix.slurm }}-${{ matrix.target.arch }}

            # Create a unique tag based on the commit SHA (for traceability)
            type=sha,prefix=${{ matrix.slurm }}-,suffix=-${{ matrix.target.arch }},format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./services/slurm
          platforms: ${{ matrix.target.platform }}
          build-args: SLURM_TAG=slurm-${{ matrix.slurm }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.slurm }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slurm }}-${{ matrix.target.arch }}

  create-manifest:
    name: Create Multi-Arch Manifest (${{ matrix.slurm }})
    runs-on: ubuntu-latest
    needs: build-slurm-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        slurm: ["25-11-8-1", "26-05-5-1"]

    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest for latest
        if: github.ref == 'refs/heads/main' && matrix.slurm == env.DEFAULT_SLURM_VERSION
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64

      - name: Create and push multi-arch manifest for version
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.slurm }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.slurm }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.slurm }}-arm64
