name: Validation of tutorial code

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/setup-devenv/**"
      - ".github/workflows/tutorial.yaml"
      - "devenv.*"
      - "examples/**"
      - "nix/**"
      - "pixi.lock"
      - "pyproject.toml"
      - "projects/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/setup-devenv/**"
      - ".github/workflows/tutorial.yaml"
      - "devenv.*"
      - "examples/**"
      - "nix/**"
      - "pixi.lock"
      - "pyproject.toml"
      - "projects/**"
  workflow_dispatch:

concurrency:
  group: tutorial-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate tutorial
    runs-on: ubuntu-latest
    # TODO: Eventually specify a slurm cluster here for CI/CD via a (single) docker container so we can validate in CI/CD
    # services:
    #   postgres:
    #     image: postgres:17.5-alpine3.22
    #     env:
    #       POSTGRES_USER: ${{ env.BACKEND_APPLICATION__DATABASE__USERNAME }}
    #       POSTGRES_PASSWORD: ${{ env.BACKEND_APPLICATION__DATABASE__PASSWORD }}
    #       POSTGRES_DB: ${{ env.BACKEND_APPLICATION__DATABASE__DATABASE_NAME }}
    #     ports:
    #       - 7432:5432
    #     # Add health check to ensure postgres is ready
    #     options: >-
    #       --health-cmd "pg_isready -U test_user -d test_db"
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup CI tools
        uses: ./.github/actions/setup-devenv

      - run: bash -lc 'cd examples && pixi run -e dev --frozen lint'

      - run: bash -lc 'cd examples && pixi run -e dev --frozen test'

      - name: Pack tutorial environment
        run: |
          max_attempts=3

          for attempt in $(seq 1 "${max_attempts}"); do
            if bash -lc 'cd examples && pixi run pack'; then
              exit 0
            fi

            rm -f examples/environment.sh examples/environment.tar

            if [[ "${attempt}" -eq "${max_attempts}" ]]; then
              echo "::error::Packing tutorial environment failed after ${max_attempts} attempts."
              exit 1
            fi

            delay_seconds=$((attempt * 15))
            echo "::warning::Packing tutorial environment failed on attempt ${attempt}/${max_attempts}; retrying in ${delay_seconds}s."
            sleep "${delay_seconds}"
          done

      - name: Store Packed Environment as Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packed-slurm-cluster-environment-${{ github.sha }}
          path: ./examples/environment.tar
          retention-days: 3
